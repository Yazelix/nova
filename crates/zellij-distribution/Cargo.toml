[package]
name = "nova-zellij-distribution"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "yzx-zellij"
path = "src/main.rs"

[dependencies]
# Upstream's default features without "window", its standalone GUI terminal.
zellij = { git = "https://github.com/zellij-org/zellij", rev = "77debdeb2c48d7e3529c55dbed16c78e16ee9cf9", default-features = false, features = ["plugins_from_target", "vendored_curl", "web_server_capability"] }

[profile.release]
lto = true
codegen-units = 1

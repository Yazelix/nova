[[mgr.prepend_keymap]]
on = ["q"]
run = "noop"
desc = "Disabled; Esc or Ctrl C cancels"

[[mgr.prepend_keymap]]
on = ["Q"]
run = "noop"
desc = "Disabled; Esc or Ctrl C cancels"

[[mgr.prepend_keymap]]
on = ["<C-c>"]
run = "quit --no-cwd-file --code=130"
desc = "Cancel startup picker"

[[mgr.prepend_keymap]]
on = ["<Esc>"]
run = "quit --no-cwd-file --code=130"
desc = "Cancel startup picker"
